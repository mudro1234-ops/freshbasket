<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="site-nav.css" />
  <link rel="stylesheet" href="contact.css" />
</head>
<body>
  <nav class="topnav"><a href="index.html">HOME</a><a href="Products.html">PRODUCTS</a><a href="quotation.html">QUOTATION</a><a href="contact.html" class="on">CONTACT</a><a href="cart.html">CART</a></nav>
  <section id="last">
    <!-- heading -->
    <div class="full">
      <h3>Drop a Message</h3>

      <div class="lt">
        <!-- form starting -->
        <form class="form-horizontal" id="contactForm">
          <div class="form-group">
            <div class="col-sm-12">
              <input type="text" class="form-control" id="name" placeholder="NAME" name="name" required />
            </div>
          </div>

          <div class="form-group">
            <div class="col-sm-12">
              <input type="email" class="form-control" id="email" placeholder="EMAIL" name="email" required />
            </div>
          </div>

          <textarea class="form-control" rows="10" placeholder="MESSAGE" name="message" id="message" required></textarea>

          <button class="btn btn-primary send-button" id="submit" type="submit">
            <i class="fa fa-paper-plane"></i>
            <span class="send-text">SEND</span>
          </button>
          <p id="status" class="status"></p>
        </form>
        <!-- end of form -->
      </div>

      <!-- Contact information -->
      <div class="rt">
        <ul class="contact-list">
          <li class="list-item">
            <i class="fa fa-map-marker fa-1x">
              <span class="contact-text place">your address :- bh-657 - vasant colony , sector: phugwara 11411</span>
            </i>
          </li>
          <li class="list-item">
            <i class="fa fa-envelope fa-1x">
              <span class="contact-text gmail">
                <a href="mailto:shoppit234email@gmail.com" title="Send us an email">shoppit234email@gmail.com</a>
              </span>
            </i>
          </li>
          <li class="list-item">
            <i class="fa fa-phone fa-1x">
              <span class="contact-text phone">(033) 12345678</span>
            </i>
          </li>
          <li class="list-item"><a href="index.html"><i class="fa fa-home"><span class="contact-text">Back to store</span></i></a></li>
        </ul>
      </div>
    </div>
  </section>

  <script>
    // No server (contact.php) exists, so the message is saved in this browser and a confirmation is shown.
    document.getElementById('contactForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var f = ev.target;
      try {
        var all = JSON.parse(localStorage.getItem('shopMessages') || '[]');
        all.push({ name: f.name.value, email: f.email.value, message: f.message.value, at: new Date().toISOString() });
        localStorage.setItem('shopMessages', JSON.stringify(all));
      } catch (e) {}
      document.getElementById('status').textContent = 'Thanks ' + f.name.value + '! Your message was sent.';
      f.reset();
    });
  </script>
</body>
</html>
